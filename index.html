<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCYTHERS: the set of the film</title>
<style>
:root{--bg:#0d0f10;--panel:#171a1c;--ink:#e8e6df;--soft:#9ea3a3;--teal:#4cc1b7;--red:#ff6b5e;--line:#2c3133}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);background:rgba(10,12,13,.78);border:1px solid var(--line);
  color:var(--ink);padding:2px 7px;border-radius:4px;font-size:12px;white-space:nowrap}
.lbl.cam{background:var(--teal);color:#071312;border-color:var(--teal);font-weight:700;transform:translate(-50%,-50%)}
#panel{position:absolute;left:12px;top:12px;width:270px;max-height:calc(100% - 24px);overflow:auto;background:rgba(23,26,28,.94);
  border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
#panel h1{font-size:15px;margin:0;letter-spacing:.02em}
#panel p{margin:0;color:var(--soft);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{background:#22272a;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font:inherit;font-size:12px;cursor:pointer}
button.on{background:var(--teal);color:#071312;border-color:var(--teal);font-weight:600}
#cap{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:min(900px,90vw);background:rgba(10,12,13,.85);
  border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:13px;text-align:center}
#cap b{color:var(--teal)}
#cap .hint{display:block;color:var(--soft);font-size:12px;margin-top:3px}
.lbl.plan{background:rgba(10,12,13,.88);font-size:13px;font-weight:600;padding:3px 8px;transform:translate(-50%,-50%)}
.lbl.plan.small{font-size:11px;font-weight:500;padding:1px 6px}
#showPanel{position:absolute;left:12px;top:12px;display:none}
body.nopanel #panel{display:none}
body.nopanel #showPanel{display:block}
@media (max-width:760px){#panel{width:min(270px,86vw)}#cap{font-size:12px;max-width:94vw;bottom:8px}.lbl{font-size:9px;padding:1px 4px}.lbl.plan{font-size:10px}.lbl.plan.small{display:none}}
@media (max-width:760px) and (orientation:portrait){#cap::after{content:"Turn the phone sideways for a larger view";display:block;color:var(--soft);font-size:11px;margin-top:3px}}
.lbl.pubhide{display:none!important}
</style>
<script data-goatcounter="https://acidstates.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="panel">
  <h1>SCYTHERS · the set of the film</h1>
  <p>The 3D map of the facility. Every shot of the film is staged in it. Pick a view or a shot camera. Mouse: drag to turn, wheel to zoom.</p>
  <div class="row" id="views"></div>
  <div class="row">
    <button id="mScheme" class="on">Scheme</button>
    <button id="mGrey">Grey (for painting)</button>
    <button id="mLine">Lines</button>
  </div>
  <div class="row">
    <button id="lOn">Lights on</button>
    <button id="lOff" class="on">Lights out</button>
  </div>
  <div class="row">
    <button id="tLabels">Labels in shots</button>
    <button id="tPeople" class="on">People</button>
    <button id="hidePanel">Hide panel</button>
  </div>
</div>
<button id="showPanel">Panel</button>
<div id="cap"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Layout of the room (metres). x: west -> east, z: north -> south, y: up ----------
const ROOM = { x0: -7, x1: 7, z0: -5, z1: 5, h: 4.2 };
const CAPSULE = { x: 1.9, z: -3.95 };           // the one capsule: at Ren's left, against the north wall, further left (owner 24.11: move it further left)
const REN = { chair: [3.7, -1.2], faceY: 1.27 };  // owner 24.11: Ren's desk lower on the plan (south)  // Ren faces east to her monitor; the capsule is at her left, by the wall
const HALE = { chair: [-0.5, 1.4], faceY: 1.33 };  // owner 24.11: Hale a bit up on the plan, closer to the creature // Hale faces south, the console is in front of him; Ren sees him past the capsule
const DOOR = { x: 5.2, w: 1.3, h: 2.3 };          // steel door in the south wall to the service corridor
const BREACH = { x: 0.6, w: 2.4 };                // the concrete wall the creature breaks through
const CORR = { z0: 5.25, z1: 7.8, h: 3.0 };
const CX0 = -10, LX = 30, NX = 12.5;              // corridor A ends at the control post door in the west; lift wall in the east; Ren's niche in A
const NZ = CORR.z1;                               // the niche is in the south wall of A: in episode 4 (shot 1) Ren sees the lab door from it
const HX0 = -23, HZ1 = 3.3;                       // hall of capsules west of the lab: x HX0..-7.2, z -5..HZ1
const PX0 = -19, PZ0 = 3.5, PZ1 = 8.0;            // control post (the room of part 1): x PX0..CX0, z PZ0..PZ1
const CZ = (CORR.z0 + CORR.z1) / 2;               // centre line of corridor A (past the lab)
const BXC = 16, CZC = 18;                         // centre of corridor B (after the right turn) and of corridor C (after the left turn)
const C_S = CZC + (CORR.z1 - CORR.z0) / 2;        // south wall of corridor C (Ren's niche is in it)
const DXC = 27, DZ0 = 9.5;                        // corridor D: from the neighbour labs down to the lift; the four scientists come from there       // service corridor outside the south wall

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 16 / 9, 0.05, 80);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.zoomToCursor = true; controls.screenSpacePanning = false;   // wheel zooms to the mouse; right drag moves along the floor
controls.minDistance = 0.3; controls.maxDistance = 90; controls.listenToKeyEvents(window);          // arrow keys move too

// ---------- Materials: each has a scheme look and a grey look ----------
const mats = [];
function mat(color, opts = {}) {
  const m = new THREE.MeshStandardMaterial({ color, roughness: opts.rough ?? 0.85, metalness: opts.metal ?? 0.1,
    emissive: opts.emissive ?? 0x000000, emissiveIntensity: opts.ei ?? 0, transparent: !!opts.opacity,
    opacity: opts.opacity ?? 1, side: opts.side ?? THREE.FrontSide });
  m.userData = { color: new THREE.Color(color), emissive: new THREE.Color(opts.emissive ?? 0), ei: opts.ei ?? 0,
    grey: opts.grey ?? 0x8c8c8c, opacity: opts.opacity ?? 1, glow: !!opts.glow, metal: opts.metal ?? 0.1 };
  mats.push(m);
  return m;
}
const M = {
  concrete: mat(0x4a4d4c, { grey: 0x7d7d7d }),
  concreteDark: mat(0x323534, { grey: 0x6a6a6a }),
  floor: mat(0x2c2f2f, { rough: 0.6, grey: 0x5c5c5c }),
  steel: mat(0x5b6266, { metal: 0.6, rough: 0.45, grey: 0x9a9a9a }),
  steelDark: mat(0x2f3437, { metal: 0.5, rough: 0.55, grey: 0x707070 }),
  pipe: mat(0x3d4346, { metal: 0.5, rough: 0.5, grey: 0x777777 }),
  glass: mat(0x5fd6c8, { opacity: 0.25, rough: 0.1, metal: 0.0, emissive: 0x2a9d90, ei: 0.18, grey: 0xb5b5b5, glow: true, side: THREE.DoubleSide }),
  liquid: mat(0x2fb3a4, { opacity: 0.42, emissive: 0x1f8f83, ei: 0.35, grey: 0xc8c8c8, glow: true }),
  creature: mat(0x0b0d0e, { rough: 0.7, grey: 0x2e2e2e }),
  screen: mat(0x163b38, { emissive: 0x47d1c2, ei: 1.1, grey: 0xd0d0d0, glow: true }),
  consoleScreen: mat(0x1d2a2a, { emissive: 0xbfe3e0, ei: 0.7, grey: 0xd0d0d0, glow: true }),
  key: mat(0x111314, { grey: 0x3a3a3a }),
  amber: mat(0x7a4b00, { emissive: 0xffa21a, ei: 1.2, grey: 0x9a9a9a, glow: true }),
  coatRen: mat(0xd9d6cf, { grey: 0xbdbdbd }),
  coatHale: mat(0xdedbd4, { grey: 0xb0b0b0 }),
  skin: mat(0xb58e76, { grey: 0xa5a5a5 }),
  hairRen: mat(0x5a3f2c, { grey: 0x555555 }),
  hairHale: mat(0x141414, { grey: 0x3c3c3c }),
  trousers: mat(0x2c2b27, { grey: 0x5f5f5f }),
  lampShade: mat(0x3a3f42, { metal: 0.5, rough: 0.4, grey: 0x777777 }),
  lampBulb: mat(0xfff3d6, { emissive: 0xfff0c8, ei: 1.5, grey: 0xe0e0e0, glow: true }),
  door: mat(0x5c6366, { metal: 0.55, rough: 0.5, grey: 0x949494 }),
  crack: mat(0x5c5f5e, { grey: 0x8a8a8a }),
  marker: mat(0x4cc1b7, { emissive: 0x4cc1b7, ei: 0.8, grey: 0x4cc1b7 }),
};

const box = (w, h, d, m, x, y, z, parent = scene) => {
  const g = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  g.position.set(x, y, z); g.castShadow = true; g.receiveShadow = true; parent.add(g); return g;
};
const cyl = (r, h, m, x, y, z, seg = 32, parent = scene, r2 = r) => {
  const g = new THREE.Mesh(new THREE.CylinderGeometry(r, r2, h, seg), m);
  g.position.set(x, y, z); g.castShadow = true; g.receiveShadow = true; parent.add(g); return g;
};

// ---------- The room ----------
const W = ROOM.x1 - ROOM.x0, D = ROOM.z1 - ROOM.z0;
box(W, 0.1, D, M.floor, 0, -0.05, 0);
const roof = new THREE.Group(); scene.add(roof);                         // hidden in the plan and the free view
box(W, 0.1, D, M.concreteDark, 0, ROOM.h + 0.05, 0, roof);
box(W, ROOM.h, 0.2, M.concrete, 0, ROOM.h / 2, ROOM.z0 - 0.1);            // north wall
box(0.2, ROOM.h, D, M.concrete, ROOM.x1 + 0.1, ROOM.h / 2, 0);            // east wall
// west wall with a wide passage to the hall of capsules
box(0.2, ROOM.h, 3.4, M.concrete, ROOM.x0 - 0.1, ROOM.h / 2, ROOM.z0 + 1.7);
box(0.2, ROOM.h, 3.6, M.concrete, ROOM.x0 - 0.1, ROOM.h / 2, ROOM.z1 - 1.8);
box(0.2, ROOM.h - 2.8, 3.0, M.concrete, ROOM.x0 - 0.1, 2.8 + (ROOM.h - 2.8) / 2, ROOM.z0 + 4.9);
// south wall: a steel door and the breach section, the rest plain concrete
const southSegs = [[ROOM.x0, BREACH.x - BREACH.w / 2], [BREACH.x + BREACH.w / 2, DOOR.x - DOOR.w / 2], [DOOR.x + DOOR.w / 2, ROOM.x1]];
for (const [a, b] of southSegs) box(b - a, ROOM.h, 0.2, M.concrete, (a + b) / 2, ROOM.h / 2, ROOM.z1 + 0.1);
box(DOOR.w, ROOM.h - DOOR.h, 0.2, M.concrete, DOOR.x, DOOR.h + (ROOM.h - DOOR.h) / 2, ROOM.z1 + 0.1);
box(BREACH.w, ROOM.h, 0.2, M.crack, BREACH.x, ROOM.h / 2, ROOM.z1 + 0.1);
const doorPivot = new THREE.Group(); doorPivot.position.set(DOOR.x + DOOR.w / 2 - 0.04, 0, ROOM.z1 + 0.24); scene.add(doorPivot);
box(DOOR.w - 0.08, DOOR.h - 0.04, 0.08, M.door, -(DOOR.w - 0.08) / 2, DOOR.h / 2, 0, doorPivot);   // opens into the corridor (shots 24+)
box(0.08, DOOR.h, 0.24, M.steel, DOOR.x - DOOR.w / 2, DOOR.h / 2, ROOM.z1 + 0.1);
box(0.08, DOOR.h, 0.24, M.steel, DOOR.x + DOOR.w / 2, DOOR.h / 2, ROOM.z1 + 0.1);
// ceiling beams and pipes
for (let x = -6; x <= 6; x += 2) box(0.22, 0.32, D, M.steelDark, x, ROOM.h - 0.16, 0, roof);
for (const z of [-4.7, -4.45]) { const p = cyl(0.09, W, M.pipe, 0, ROOM.h - 0.6 - (z + 4.7) * 0.6, z, 12); p.rotation.z = Math.PI / 2; }
for (const y of [3.2, 3.45]) { const p = cyl(0.07, D, M.pipe, ROOM.x1 - 0.25, y, 0, 12); p.rotation.x = Math.PI / 2; }
// floor drain strip along the north wall
box(W - 1, 0.02, 0.35, M.steelDark, 0, 0.011, ROOM.z0 + 0.9);
// cabinets along the north wall, west part
for (let i = 0; i < 4; i++) box(0.9, 2.1, 0.55, M.steelDark, -6.1 + i * 0.95, 1.05, ROOM.z0 + 0.3);
// a round wall clock on the west wall, high (Hale looks at it)
const clock = cyl(0.28, 0.06, M.steel, ROOM.x0 + 0.05, 3.0, 1.2, 32); clock.rotation.z = Math.PI / 2;

// ---------- The capsule: one, with our creature ----------
const cap = new THREE.Group(); cap.position.set(CAPSULE.x, 0, CAPSULE.z); scene.add(cap);
cyl(1.0, 0.18, M.steelDark, 0, 0.09, 0, 40, cap);
cyl(0.95, 0.5, M.steel, 0, 0.43, 0, 40, cap);
cyl(0.7, 2.2, M.liquid, 0, 1.78, 0, 40, cap);
const glass = cyl(0.74, 2.3, M.glass, 0, 1.83, 0, 40, cap); glass.castShadow = false;
cyl(0.95, 0.45, M.steel, 0, 3.2, 0, 40, cap);
cyl(0.45, 0.3, M.steelDark, 0, 3.57, 0, 24, cap);
for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.PI / 4; box(0.09, 2.3, 0.09, M.steelDark, Math.cos(a) * 0.82, 1.83, Math.sin(a) * 0.82, cap); }
for (const dx of [-0.25, 0.25]) cyl(0.07, ROOM.h - 3.7, M.pipe, dx, 3.7 + (ROOM.h - 3.7) / 2, 0, 12, cap);
for (let i = 0; i < 3; i++) { const c = cyl(0.035, 3.0, M.key, -0.98 - i * 0.05, 1.5, 0.15 * (i - 1), 8, cap); c.rotation.z = 0.04 * (i - 1); }
// the creature: a dark ball of crossed scythe blades
const beast = new THREE.Group(); beast.position.set(0, 1.85, 0); cap.add(beast);
beast.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.26, 1), M.creature));
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
for (let i = 0; i < 14; i++) {
  const sp = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.22, 6), M.creature);
  const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
  const dir = new THREE.Vector3(s * Math.cos(th), u, s * Math.sin(th)); sp.position.copy(dir.clone().multiplyScalar(0.3));
  sp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); beast.add(sp);
}
for (const [ax, ay, az] of [[0.3, 0, 0], [1.2, 0.6, 0], [-0.4, 1.4, 0.3], [0.9, -1.0, 1.2], [-1.1, 0.4, -0.8], [0.2, 2.2, -0.5], [1.6, 1.0, 0.9]]) {
  const b = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.028, 6, 32, Math.PI * 0.75), M.creature);
  b.rotation.set(ax, ay, az); b.scale.set(1, 1, 0.35); beast.add(b);
}

// ---------- Ren's workstation ----------
const [rx, rz] = REN.chair;
box(0.85, 0.06, 1.9, M.steel, rx + 0.95, 0.78, rz);                         // desk top
for (const dz of [-0.85, 0.85]) box(0.06, 0.75, 0.75, M.steelDark, rx + 0.95, 0.375, rz + dz);
box(0.06, 0.55, 0.32, M.steelDark, rx + 1.3, 1.05, rz);                     // monitor arm post
box(0.08, 0.42, 0.62, M.steelDark, rx + 1.25, 1.28, rz);                    // monitor casing
box(0.01, 0.34, 0.52, M.screen, rx + 1.2, 1.28, rz);                        // monitor screen (faces west, to Ren)
box(0.2, 0.025, 0.5, M.key, rx + 0.82, 0.82, rz);                           // keyboard
for (const [dx, dz, r, h] of [[1.15, 0.65, 0.11, 0.3], [1.0, 0.82, 0.08, 0.2], [1.2, -0.7, 0.07, 0.14]]) cyl(r, h, M.steel, rx + dx, 0.81 + h / 2, rz + dz, 20);
cyl(0.25, 0.06, M.steelDark, rx, 0.5, rz, 20); cyl(0.03, 0.45, M.steel, rx, 0.25, rz, 8);
box(0.05, 0.5, 0.42, M.steelDark, rx - 0.24, 0.8, rz);
const lampRen = new THREE.Group(); lampRen.position.set(rx + 0.6, ROOM.h - 0.9, rz + 0.8); scene.add(lampRen);
cyl(0.012, 0.9, M.key, 0, 0.45, 0, 6, lampRen);
lampRen.add(new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), M.lampShade));
const bulb1 = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 8), M.lampBulb); bulb1.position.y = -0.02; lampRen.add(bulb1);

// ---------- Hale's console ----------
const [hx, hz] = HALE.chair;
const con = new THREE.Group(); con.position.set(hx, 0, hz + 0.75); scene.add(con);
// Hale sits on the north side (local z -0.75) and faces south: the key panel and the computer face him (owner 24.11)
box(1.9, 0.75, 0.6, M.steel, 0, 0.375, 0.1, con);
const pan = new THREE.Group(); pan.position.set(0, 0.8, -0.02); pan.rotation.x = -0.35; con.add(pan);  // slope rises away from Hale
box(1.9, 0.06, 0.52, M.steelDark, 0, 0, 0, pan);
for (let i = 0; i < 10; i++) for (let j = 0; j < 3; j++) box(0.09, 0.03, 0.07, M.key, -0.75 + i * 0.165, 0.045, -0.16 + j * 0.13, pan);
box(0.16, 0.04, 0.14, M.amber, 0.62, 0.05, 0.12, pan);                            // the amber key, on Hale's side of the panel
box(0.25, 0.02, 0.18, M.steelDark, -0.62, 0.92, 0.33, con);                        // computer foot, at the back edge
box(0.06, 0.24, 0.05, M.steelDark, -0.62, 1.04, 0.35, con);                        // computer neck
box(0.6, 0.4, 0.05, M.steelDark, -0.62, 1.32, 0.33, con);                          // computer monitor, back to the south
box(0.54, 0.34, 0.01, M.consoleScreen, -0.62, 1.32, 0.302, con);                   // its screen faces north, to Hale
cyl(0.26, 0.06, M.steelDark, hx, 0.5, hz, 20); cyl(0.03, 0.45, M.steel, hx, 0.25, hz, 8);
box(0.42, 0.5, 0.05, M.steelDark, hx, 0.8, hz - 0.24);
const lampHale = new THREE.Group(); lampHale.position.set(hx - 0.2, ROOM.h - 0.9, hz + 0.6); scene.add(lampHale);
cyl(0.012, 0.9, M.key, 0, 0.45, 0, 6, lampHale);
lampHale.add(new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), M.lampShade));
const bulb2 = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 8), M.lampBulb); bulb2.position.y = -0.02; lampHale.add(bulb2);

// ---------- The service corridor (episode 3, scenes 4-6) ----------
// A: past the lab, west -> east; turn right; B: south; turn left; C: east, the last straight to the lift (shot 27: the lift far ahead)
const CD = CORR.z1 - CORR.z0, HW = CD / 2, CH = CORR.h;
const AX1 = BXC + HW, BX0 = BXC - HW, CZ0 = CZC - HW;           // outer corner of A, west wall of B, north wall of C
const floorCeil = (x0, x1, z0, z1) => {
  box(x1 - x0, 0.1, z1 - z0, M.floor, (x0 + x1) / 2, -0.05, (z0 + z1) / 2);
  box(x1 - x0, 0.1, z1 - z0, M.concreteDark, (x0 + x1) / 2, CH + 0.05, (z0 + z1) / 2, roof);
};
const wallX = (x0, x1, z, m = M.concrete) => box(x1 - x0, CH, 0.2, m, (x0 + x1) / 2, CH / 2, z);
const wallZ = (z0, z1, x, m = M.concrete) => box(0.2, CH, z1 - z0, m, x, CH / 2, (z0 + z1) / 2);
floorCeil(CX0, AX1, CORR.z0, CORR.z1); floorCeil(BX0, AX1, CORR.z1, CZ0); floorCeil(BX0, LX, CZ0, C_S);
// A: the lab wall in the north (with extensions), the south wall up to the opening of B, the dead end in the west
wallX(CX0, ROOM.x0 - 0.2, CORR.z0 - 0.1); wallX(ROOM.x1 + 0.2, AX1 + 0.2, CORR.z0 - 0.1);
wallX(CX0, NX - 0.55, CORR.z1 + 0.1); wallX(NX + 0.55, BX0 - 0.2, CORR.z1 + 0.1);
// unit4-remove-corridor-dead-end: src/post.js has the bigger control post.
// unit4-remove-post-door: src/post.js has the bigger control post.

function facBox(group, name, w, h, d, material, x, y, z) {
  const mesh = box(w, h, d, material, x, y, z, group);
  mesh.name = name;
  mesh.userData.facilityGroup = group.name;
  return mesh;
}
function facCyl(group, name, r, h, material, x, y, z, seg = 12, r2 = r) {
  const mesh = cyl(r, h, material, x, y, z, seg, group, r2);
  mesh.name = name;
  mesh.userData.facilityGroup = group.name;
  return mesh;
}
function instancedBoxes(group, name, count, w, h, d, material, positions) {
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(w, h, d), material, count);
  mesh.name = name;
  mesh.userData.facilityGroup = group.name;
  const m = new THREE.Matrix4();
  positions.forEach((p, i) => { m.makeTranslation(p[0], p[1], p[2]); mesh.setMatrixAt(i, m); });
  mesh.instanceMatrix.needsUpdate = true;
  group.add(mesh);
  return mesh;
}
function instancedCylinders(group, name, count, radius, height, material, positions, rotation = 'y') {
  const mesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(radius, radius, height, 10), material, count);
  mesh.name = name;
  mesh.userData.facilityGroup = group.name;
  const m = new THREE.Matrix4();
  positions.forEach((p, i) => {
    const q = new THREE.Object3D(); q.position.set(p[0], p[1], p[2]);
    if (rotation === 'x') q.rotation.x = Math.PI / 2;
    if (rotation === 'z') q.rotation.z = Math.PI / 2;
    q.updateMatrix(); mesh.setMatrixAt(i, q.matrix);
  });
  mesh.instanceMatrix.needsUpdate = true;
  group.add(mesh);
  return mesh;
}

    mesh.userData.floorStanding = y - height / 2 < 0.08;

    if (rotation === 'z') mesh.rotation.z = Math.PI / 2;

// ---------- The security cameras of Kade: objects in the map, live feeds on his monitor wall (cctv_block.py) ----------
(() => {
  const CAMS = [[1, "CCTV 1: hall of capsules", [-7.9, 3.85, 2.9], [-19.0, 1.0, -3.0]],[2, "CCTV 2: lab of Ren and Hale", [6.6, 3.85, 4.5], [1.5, 1.1, -3.2]],[3, "CCTV 3: corridor A, the blast door", [13.0, 2.75, 6.0], [-10.5, 1.2, 6.5]],[4, "CCTV 4: vestibule", null, [-26.4, 34.3, 1.4]],[5, "CCTV 5: corridor A, the lab door", [-8.8, 2.75, 7.4], [12.0, 1.1, 6.5]],[6, "CCTV 6: corridor B", [16.9, 2.75, 8.2], [16.0, 1.0, 16.0]],[7, "CCTV 7: corridor C, the lift", [15.1, 2.75, 18.9], [30.0, 1.2, 18.0]],[8, "CCTV 8: corridor D", [27.9, 2.75, 10.0], [27.0, 1.0, 16.5]]];
  const group = new THREE.Group(); group.name = 'cctvCameras'; scene.add(group);
  const bodyM = mat(0x2b2f33, { rough: 0.55, metal: 0.35, grey: 0x707070 });
  const lensM = mat(0x0d0f10, { rough: 0.2, metal: 0.6, grey: 0x303030 });
  const ledM = mat(0xff2a1a, { emissive: 0xff2a1a, ei: 2.4, glow: true, grey: 0xdddddd });
  const lineM = new THREE.LineBasicMaterial({ color: 0xff5a4a, transparent: true, opacity: 0.55, depthWrite: false });
  const vest = scene.getObjectByName('vestCeilingCamera');
  const feeds = [];
  // One shared light for the feeds, always visible (a change of the light count makes three.js select programs again).
  // Intensity 0 outside a feed draw; during a feed it stands at the camera of that feed.
  const ir = new THREE.PointLight(0xdfe8ff, 0, 16, 2); ir.name = 'cctvFeedLight'; scene.add(ir);
  for (const [n, text, pos, at] of CAMS) {
    const p = pos ? new THREE.Vector3(...pos) : (vest ? vest.getWorldPosition(new THREE.Vector3()) : null);
    if (!p) continue;
    const t = new THREE.Vector3(...at);
    const rig = new THREE.Group(); rig.name = 'cctv' + n; rig.position.copy(p); rig.lookAt(t); group.add(rig);
    if (pos) {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.14, 0.34), bodyM); body.name = 'cctvBody' + n; rig.add(body);
      const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.055, 0.08, 16), lensM);
      lens.rotation.x = Math.PI / 2; lens.position.z = 0.2; rig.add(lens);
      const led = new THREE.Mesh(new THREE.SphereGeometry(0.018, 10, 8), ledM); led.position.set(0.05, 0.05, 0.172); rig.add(led);
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.22, 0.04), bodyM); arm.name = 'cctvArm' + n;
      arm.position.copy(p).add(new THREE.Vector3(0, 0.16, 0)); group.add(arm);
    }
    // The field of view as red lines, 3 m long.
    const fov = 58 * Math.PI / 180, asp = 0.78 / 0.56, far = 3.0;
    const hh = Math.tan(fov / 2) * far, hw = hh * asp;
    const c = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].map(([x, y]) => new THREE.Vector3(x, y, far));
    const pts = []; for (const v of c) pts.push(new THREE.Vector3(0, 0, 0), v);
    for (let i = 0; i < 4; i++) pts.push(c[i], c[(i + 1) % 4]);
    const lines = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), lineM); lines.name = 'cctvView' + n; rig.add(lines);
    label(text, [p.x, p.y + 0.4, p.z], 'plan small');
    const cam = new THREE.PerspectiveCamera(58, asp, 0.05, 60);
    cam.position.copy(p).add(t.clone().sub(p).normalize().multiplyScalar(0.3)); cam.lookAt(t);   // in front of its own body
    const rt = new THREE.WebGLRenderTarget(320, 230);
    feeds.push({ n, cam, rt, rig, ground: !pos });
  }
  // The screens of the wall: an instanced mesh of 8 boxes; a plane with the feed goes 8 mm in front of each.
  const wall = scene.getObjectByName('guardMonitorScreens');
  if (wall && wall.isInstancedMesh) {
    wall.updateWorldMatrix(true, false);
    const m4 = new THREE.Matrix4(), pos = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
    const order = [4, 5, 6, 7, 0, 1, 2, 3];               // instances 4-7 = the upper row, 0-3 = the lower row
    feeds.forEach((f, i) => {
      const k = order[i]; if (k >= wall.count) return;
      wall.getMatrixAt(k, m4); m4.premultiply(wall.matrixWorld); m4.decompose(pos, q, s);
      const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.74, 0.53), new THREE.MeshBasicMaterial({ map: f.rt.texture, toneMapped: false }));
      scr.name = 'cctvScreen' + f.n; scr.quaternion.copy(q);
      scr.position.copy(pos).add(new THREE.Vector3(0, 0, 0.008).applyQuaternion(q));
      group.add(scr); f.screen = scr;
    });
  }
  // One feed per frame. The rigs and the screens are hidden while a feed is drawn, so no screen draws itself.
  // The feeds are drawn only while the monitor wall is in the view of the main camera, at most 30 m away.
  let next = 0;
  const frustum = new THREE.Frustum(), pv = new THREE.Matrix4(), wallBox = new THREE.Box3();
  if (wall) { wall.updateWorldMatrix(true, false); wallBox.setFromObject(wall); }
  const wallSeen = () => {
    if (!wall || !document.body || document.hidden || plan) return false;   // the plan views look down: the wall is not seen
    camera.updateMatrixWorld(); pv.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse); frustum.setFromProjectionMatrix(pv);
    return frustum.intersectsBox(wallBox) && camera.position.distanceTo(wallBox.getCenter(new THREE.Vector3())) < 30;
  };
  function feedTick() {
    if (feeds.length && wallSeen()) {
      const f = feeds[next % feeds.length]; next++;
      const old = renderer.getRenderTarget();
      // The vestibule is on the ground level: the map hides that level in most views, so the feed shows it for one draw.
      // Lights keep their visible state (a change of the light count makes three.js select programs again).
      const G = f.ground && window.__ground ? window.__ground : null;
      const keep = G ? [G.group.visible, vest ? vest.visible : true] : null;
      if (G) { G.group.visible = true; if (vest) vest.visible = false; }
      const shadows = renderer.shadowMap.autoUpdate; renderer.shadowMap.autoUpdate = false;
      ir.position.copy(f.cam.position); ir.intensity = 9;
      group.visible = false; renderer.setRenderTarget(f.rt); renderer.render(scene, f.cam);
      renderer.setRenderTarget(old); ir.intensity = 0; group.visible = true; renderer.shadowMap.autoUpdate = shadows;
      if (G) { G.group.visible = keep[0]; if (vest) vest.visible = keep[1]; }
    }
    requestAnimationFrame(feedTick);
  }
  requestAnimationFrame(feedTick);
  addBtn('u2dKade', 'Kade: his monitor wall');
  window.__cctv = { feeds, group };
})();
setMode('scheme'); setView('section'); if (innerWidth < 760 || innerHeight < 500) document.body.classList.add('nopanel'); loop();
</script>
</body>
</html>
