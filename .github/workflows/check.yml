name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the page text
        run: python3 tools/check_page.py index.html /tmp/page_module.mjs
      - name: Check the syntax of the page script
        run: node --check /tmp/page_module.mjs
